<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtTrace</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
      canvas { display: block; background: #fff; border: 1px solid #dee2e6; }
      button {
        padding: 6px 14px; border: 1px solid #adb5bd; border-radius: 4px;
        background: #fff; cursor: pointer; font-size: 14px;
      }
      button:hover:not(:disabled) { background: #e9ecef; }
      button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
